[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consumption-viewer"
version = "0.1.0"
description = "MACC Consumption Plan uploader, editor, and executive dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41",
  "pandas>=2.2",
  "numpy>=2.1",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
